name: Reproducibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-training.txt
      - run: python -m pip check
      - name: Test masking, loss, split isolation and generation
        run: python -m unittest discover -s tests -v
        env:
          HF_HUB_OFFLINE: '1'
      - run: python -m compileall -q train.py training_data.py evaluate.py evaluate_checkpoint.py comparison_data.py train_t5.py compare_summarizers.py score_detail_audit.py
